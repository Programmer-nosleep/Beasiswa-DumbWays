<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg app-navbar py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="logo-text">DU</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link fw-bold active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="myproject.html">My Project</a>
                    </li>
                </ul>
                <a href="form.html" class="btn btn-dark rounded-pill px-4 py-2">Contact Me</a>
            </div>
        </div>
    </nav>

    <!-- Add My Project Section -->
    <section class="add-project-section">
        <div class="container">
            <div class="project-form-card">
                <h2 class="form-title">ADD MY PROJECT</h2>

                <form id="projectForm">
                    <!-- Project Name -->
                    <div class="mb-4">
                        <label class="form-label project-label">Project Name</label>
                        <input type="text" class="form-control project-input" id="projectName"
                            placeholder="Enter project name" required>
                    </div>

                    <!-- Date Range -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label project-label">Start Date</label>
                            <input type="date" class="form-control project-input" id="startDate" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label project-label">End Date</label>
                            <input type="date" class="form-control project-input" id="endDate" required>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-4">
                        <label class="form-label project-label">Description</label>
                        <textarea class="form-control project-input project-textarea" id="description" rows="4"
                            placeholder="Enter project description" required></textarea>
                    </div>

                    <!-- Technologies -->
                    <div class="mb-4">
                        <label class="form-label project-label">Technologies</label>
                        <div class="tech-checkbox-group">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input tech-checkbox" type="checkbox" id="nodejs"
                                    value="Node Js">
                                <label class="form-check-label" for="nodejs">Node Js</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input tech-checkbox" type="checkbox" id="nextjs"
                                    value="Next Js">
                                <label class="form-check-label" for="nextjs">Next Js</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input tech-checkbox" type="checkbox" id="reactjs"
                                    value="React Js">
                                <label class="form-check-label" for="reactjs">React Js</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input tech-checkbox" type="checkbox" id="typescript"
                                    value="TypeScript">
                                <label class="form-check-label" for="typescript">TypeScript</label>
                            </div>
                        </div>
                    </div>

                    <!-- Upload Image -->
                    <div class="mb-4">
                        <label class="form-label project-label">Upload Image</label>
                        <div class="upload-wrapper">
                            <label for="projectImage" class="upload-label">
                                <span class="upload-text">choose</span>
                                <span class="upload-icon"><i class="bi bi-paperclip"></i></span>
                            </label>
                            <input type="file" class="form-control d-none" id="projectImage" accept="image/*">
                            <span class="file-name" id="fileName"></span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="text-end">
                        <button type="submit" class="btn btn-submit-project">submit</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- My Project Section -->
    <section class="my-project-section">
        <div class="container">
            <h2 class="section-title">MY PROJECT</h2>

            <div class="row g-4" id="projectGrid">
                <!-- Project cards will be rendered here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
</CodeContent>
